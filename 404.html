<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Detect any /gallery/{slug} URL and redirect to the gallery page
    const path = window.location.pathname;
    const match = path.match(/^\/gallery\/([^\/]+)/);

    if (match) {
      const slug = match[1];
      // redirect back to /gallery with query so your JS can pick it up
      const redirectUrl = `/gallery/?gallery=${slug}`;
      window.location.replace(redirectUrl);
    } else {
      // otherwise just show normal 404
      document.write("<h1>404 - Page Not Found</h1>");
    }
  </script>
</head>
<body></body>
</html>
